<h1>Staffing Requirements</h1>

<table class="staffing-table table table-bordered">
  <thead>
    <tr>
      <th>Date</th>
      <th>Time Period</th>
      <th>Required Agents</th>
    </tr>
  </thead>

  <tbody>
    @for (item of staffingRequirements; track item.id) {
      <tr>
        <td>
          {{ item.date | date:'MMM d, yyyy' }}
        </td>

    <td>
      {{ item.startTime }} - {{ item.endTime }}
    </td>

    <td>
      {{ item.requiredAgents }}
    </td>
  </tr>
} @empty {
  <tr>
    <td colspan="3">
      No staffing requirements found.
    </td>
  </tr>
}

  </tbody>
</table>
