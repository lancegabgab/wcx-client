<h1>Your Agents</h1>
<div class="agents-container">
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Created At</th>
      </tr>
    </thead>

    <tbody>
      @for (agent of agents; track agent.id) {
        <tr>
          <td>
            {{ agent.firstName }}
            {{ agent.middleName }}
            {{ agent.lastName }}
          </td>

          <td>
            {{ agent.email }}
          </td>

          <td>
            {{ agent.role }}
          </td>

          <td>
            {{ agent.createdAt | date:'MMM dd, yyyy' }}
          </td>
        </tr>
      }
    </tbody>
  </table>

</div>
